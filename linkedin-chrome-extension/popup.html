<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Xonier CRM LinkedIn Connector</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 300px;
      margin: 0;
      padding: 16px;
      background: #f8fafc;
      color: #0f172a;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      color: #0a66c2;
      margin-bottom: 12px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.45;
    }
    .status {
      font-weight: 600;
      margin-bottom: 6px;
    }
    .ok { color: #059669; }
    .warn { color: #d97706; }
    button {
      margin-top: 12px;
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      background: #0a66c2;
      cursor: pointer;
    }
    button:hover {
      background: #004182;
    }
  </style>
</head>
<body>
  <div class="brand">Xonier CRM LinkedIn Connector</div>
  <div class="card">
    <div id="status" class="status">Checking LinkedIn session…</div>
    <div id="detail">Checking if you are signed in to LinkedIn in this Chrome browser.</div>
    <button id="open-li" type="button">Open LinkedIn</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
