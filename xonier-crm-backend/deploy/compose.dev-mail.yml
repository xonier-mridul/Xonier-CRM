# Development only. Never publish these ports through Nginx or a public interface.
# Official image: https://mailpit.axllent.org/docs/install/docker/
name: trakeroo-dev-mail
services:
  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "500"
      MP_MAX_AGE: "24h"
      # Default temporary database is deleted on graceful shutdown; no volume.
      MP_DISABLE_VERSION_CHECK: "true"
      MP_ALLOWED_HOSTS: "localhost,127.0.0.1"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      MP_QUIET: "true"
    security_opt:
      - no-new-privileges:true
